# Project Everflow — local development with hot reload.
#
#   docker compose -f docker-compose.dev.yml up --build
#
#   UI (Vite HMR):  http://localhost:5173
#   API + docs:     http://localhost:8000/docs
#   Sandbox agent:  http://localhost:8090/health  (published for debug only)
#
# Edit source on the host; containers pick up changes via bind mounts.
# Host requirements: Linux + /dev/kvm for real microVMs (no mock by default).

services:
  # Always-on private registry (seed guest via ./deploy/local-registry.sh)
  registry:
    image: ${EVERFLOW_REGISTRY_IMAGE:-docker.io/library/registry:2}
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    ports:
      - "127.0.0.1:${REGISTRY_HOST_PORT:-5000}:5000"
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:5000/v2/",
        ]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s

  sandbox-agent:
    build:
      context: .
      dockerfile: deploy/sandbox-agent.Dockerfile
      args:
        MICRO_SANDBOX_BASE: ${MICRO_SANDBOX_BASE:-ghcr.io/superradcompany/microsandbox:latest}
    privileged: true
    devices:
      - /dev/kvm
    environment:
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      SANDBOX_MOCK: ${SANDBOX_MOCK:-false}
      # Guest image for project microVMs — msb uses compose DNS (registry:5000)
      DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-registry:5000/everflow/everflow-sandbox-guest:latest}
      VOLUME_STRATEGY: ${VOLUME_STRATEGY:-auto}
      WORKSPACE_ROOT: /workspaces
      MSB_HOME: /root/.microsandbox
      # Platform API as reached from agent (Everflow MCP reverse tunnel dial target)
      PLATFORM_API_URL: ${AGENT_PLATFORM_API_URL:-http://backend:8000}
    volumes:
      - msb_data:/root/.microsandbox
      - project_workspaces:/workspaces
      # Hot reload: agent source from the host (:Z for SELinux/Podman)
      - ./everflow-sandbox-agent/app:/app/app:Z
      # Sync MCP package into guest on OpenCode ensure (stale guest images keep old tools otherwise)
      - ./everflow-mcp:/opt/everflow-mcp:Z
    ports:
      - "8090:8090"
    depends_on:
      registry:
        condition: service_healthy
    command:
      [
        "python3",
        "-m",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
        "--reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  searxng:
    # Prefer mirrored image after seed; fall back to Docker Hub for first online dev boot
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-everflow-dev-searxng-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:Z,ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:Z,ro
    expose:
      - "8080"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/everflow.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_AGENT_URL: http://sandbox-agent:8090
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      SANDBOX_DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-registry:5000/everflow/everflow-sandbox-guest:latest}
      SANDBOX_DEFAULT_MEMORY_MIB: ${SANDBOX_DEFAULT_MEMORY_MIB:-2048}
      SANDBOX_DEFAULT_CPUS: ${SANDBOX_DEFAULT_CPUS:-2}
      AGENT_PLATFORM_API_URL: ${AGENT_PLATFORM_API_URL:-http://backend:8000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      # Live Preview: iframe hits {uuid}.preview.localhost:8000 (*.localhost → 127.0.0.1)
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.localhost:8000}
      PREVIEW_PUBLIC_SCHEME: ${PREVIEW_PUBLIC_SCHEME:-http}
      PREVIEW_TICKET_TTL_SECONDS: ${PREVIEW_TICKET_TTL_SECONDS:-1200}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TOOLKIT_LOCAL_ROOT: ${TOOLKIT_LOCAL_ROOT:-/toolkits}
      TOOLKIT_REPO_BASE: ${TOOLKIT_REPO_BASE:-}
      UVICORN_RELOAD: "true"
    volumes:
      - everflow_db:/data
      # Hot reload: API source + migrations from the host (:Z for SELinux/Podman)
      - ./everflow-platform-api/app:/app/app:Z
      - ./everflow-platform-api/alembic:/app/alembic:Z
      - ./everflow-platform-api/alembic.ini:/app/alembic.ini:Z
      - ./toolkits:/toolkits:Z,ro
    ports:
      - "8000:8000"
    depends_on:
      registry:
        condition: service_healthy
      sandbox-agent:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.dev.Dockerfile
    environment:
      # Vite reads this at dev-server start (and on config reload)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # Set true if file watches miss events (Docker Desktop / remote FS)
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      # :Z for SELinux/Podman host bind mounts
      - ./everflow-platform-ui:/ui:Z
      # Keep container node_modules; do not overwrite with host
      - frontend_node_modules:/ui/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  everflow_db:
  msb_data:
  project_workspaces:
  frontend_node_modules:
  registry_data:
