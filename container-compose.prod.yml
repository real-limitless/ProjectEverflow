services:
  web:
    build:
      context: .
      dockerfile: Containerfile.prod
    image: project-everflow:web
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
