services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-everflow:web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
    restart: unless-stopped
