services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 8080"
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
