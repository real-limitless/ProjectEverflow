<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Everflow Desktop</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #1a2332, #0d1117);
        color: #e6edf3;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Everflow · Desktop GUI</p>
      <h1>Electron shell</h1>
      <p>
        Local: <code>npm start</code>. In Everflow Preview, run
        <code>npm run web</code> to serve this renderer over HTTP.
      </p>
    </main>
  </body>
</html>
