# Main Everflow UI (SPA). Live Preview iframes use a separate wildcard host
# (e.g. *.preview.example.com) that must terminate on the platform API, not here.
# See deploy/README.md "Live Preview".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (when VITE_API_URL is empty / relative).
    #
    # IMPORTANT: use a variable + resolver so nginx re-resolves "backend" after
    # container recreates (static proxy_pass caches the IP at nginx start → 502
    # Host is unreachable when the backend IP changes under Podman/Docker).
    # Docker embedded DNS: 127.0.0.11  |  Podman: often 10.89.0.1 from resolv.conf
    location /api/ {
        resolver 127.0.0.11 10.89.0.1 valid=10s ipv6=off;
        set $everflow_backend backend;
        proxy_pass http://$everflow_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}

