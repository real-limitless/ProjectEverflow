# Enforce Developer Certificate of Origin (DCO) on pull requests.
# Aligns with Red Hat OSPG guidance: DCO yes, CLA no.
# https://www.redhat.com/en/resources/open-source-participation-guidelines-overview
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on all PR commits
        uses: christophebedard/dco-check@0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
