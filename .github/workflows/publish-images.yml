# Publish Everflow control-plane + guest images to ghcr.io/real-limitless/*.
# Required by INSTALL_MODE=ghcr (see docs/images.md).
#
# This workflow is the publish path. A successful run still needs GHCR write
# permission on the repository (packages: write + org package settings).
# If publish is denied, the job fails — install must not pretend GHCR worked.
name: Publish images

on:
  push:
    branches:
      - Development-Everflow
    tags:
      - "BETA-*"
      - "v*"
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Extra image tag to apply (in addition to latest/sha)
        required: false
        type: string
      skip_guest:
        description: Skip the large sandbox-guest image
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  control-plane:
    name: Publish frontend / backend / sandbox-agent
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: everflow-frontend
            file: deploy/frontend.Dockerfile
            build_args: VITE_API_URL=
          - name: everflow-backend
            file: deploy/backend.Dockerfile
            build_args: ""
          - name: everflow-sandbox-agent
            file: deploy/sandbox-agent.Dockerfile
            build_args: MICRO_SANDBOX_BASE=ghcr.io/superradcompany/microsandbox:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "image=${{ env.REGISTRY }}/${owner}/${{ matrix.name }}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_name == 'Development-Everflow' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=ref,event=branch,prefix=branch-
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

  guest:
    name: Publish sandbox-guest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_guest != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Guest package must stay linked to this repo (docs/images.md). An unlinked
    # pre-existing package yields permission_denied: write_package on push.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner}/everflow-sandbox-guest" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_name == 'Development-Everflow' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=ref,event=branch,prefix=branch-
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sandbox-guest.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha,scope=everflow-sandbox-guest
          cache-to: type=gha,mode=max,scope=everflow-sandbox-guest
          # Large Fedora+Playwright image — skip attestation payloads on push.
          provenance: false
          sbom: false
