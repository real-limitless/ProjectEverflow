# Project Everflow — three services:
#   frontend       UI (public)
#   backend        everflow-platform-api (sole public API)
#   sandbox-agent  privileged KVM / microsandbox control plane (internal)
#
# Host requirements: Linux with /dev/kvm for real microVMs.
# Without KVM, set SANDBOX_MOCK=true (default in this file for safety).

services:
  sandbox-agent:
    build:
      context: .
      dockerfile: deploy/sandbox-agent.Dockerfile
    # Required for real microVMs (libkrun + KVM)
    privileged: true
    devices:
      - /dev/kvm
    environment:
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      # Real microVMs only (official msb image). Set true only for CI without KVM.
      SANDBOX_MOCK: ${SANDBOX_MOCK:-false}
      # Guest image for project microVMs (build: ./deploy/build-sandbox-guest.sh)
      DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-ghcr.io/real-limitless/everflow-sandbox-guest:dev}
      # named-volume | bind | no-volumes | auto (caches last success)
      VOLUME_STRATEGY: ${VOLUME_STRATEGY:-auto}
      WORKSPACE_ROOT: /workspaces
      MSB_HOME: /root/.microsandbox
    volumes:
      # Guest images + runtime state (must persist across restarts)
      - msb_data:/root/.microsandbox
      - project_workspaces:/workspaces
    expose:
      - "8090"
    # Debug only — do not publish in production:
    # ports:
    #   - "8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-everflow-dev-searxng-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/everflow.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_AGENT_URL: http://sandbox-agent:8090
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      SANDBOX_DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-ghcr.io/real-limitless/everflow-sandbox-guest:dev}
      SANDBOX_DEFAULT_MEMORY_MIB: ${SANDBOX_DEFAULT_MEMORY_MIB:-2048}
      SANDBOX_DEFAULT_CPUS: ${SANDBOX_DEFAULT_CPUS:-2}
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.localhost:8000}
      PREVIEW_PUBLIC_SCHEME: ${PREVIEW_PUBLIC_SCHEME:-http}
      PREVIEW_TICKET_TTL_SECONDS: ${PREVIEW_TICKET_TTL_SECONDS:-1200}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    volumes:
      - everflow_db:/data
    ports:
      - "8000:8000"
    depends_on:
      sandbox-agent:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  everflow_db:
  msb_data:
  project_workspaces:
