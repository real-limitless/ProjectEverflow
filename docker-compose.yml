# Project Everflow — container-only control plane (Docker or Podman Compose).
#
# Default: pull prebuilt images from GHCR (fast end-user install).
# From source: BUILD_FROM_SOURCE=1 ./scripts/everflow-install.sh
#   or: docker compose up --build -d
#
# Host: Docker or Podman + Compose plugin; Linux /dev/kvm for real microVMs.
# Without KVM, set SANDBOX_MOCK=true for CI/dev only (not product use).

services:
  sandbox-agent:
    image: ${EVERFLOW_SANDBOX_AGENT_IMAGE:-ghcr.io/limitless-rh/everflow-sandbox-agent:latest}
    build:
      context: .
      dockerfile: deploy/sandbox-agent.Dockerfile
    privileged: true
    devices:
      - /dev/kvm
    environment:
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      SANDBOX_MOCK: ${SANDBOX_MOCK:-false}
      DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-ghcr.io/limitless-rh/everflow-sandbox-guest:latest}
      VOLUME_STRATEGY: ${VOLUME_STRATEGY:-auto}
      WORKSPACE_ROOT: /workspaces
      MSB_HOME: /root/.microsandbox
    volumes:
      - msb_data:/root/.microsandbox
      - project_workspaces:/workspaces
    expose:
      - "8090"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-everflow-dev-searxng-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${EVERFLOW_BACKEND_IMAGE:-ghcr.io/limitless-rh/everflow-backend:latest}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/everflow.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_AGENT_URL: http://sandbox-agent:8090
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      SANDBOX_DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-ghcr.io/limitless-rh/everflow-sandbox-guest:latest}
      SANDBOX_DEFAULT_MEMORY_MIB: ${SANDBOX_DEFAULT_MEMORY_MIB:-2048}
      SANDBOX_DEFAULT_CPUS: ${SANDBOX_DEFAULT_CPUS:-2}
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.localhost:8000}
      PREVIEW_PUBLIC_SCHEME: ${PREVIEW_PUBLIC_SCHEME:-http}
      PREVIEW_TICKET_TTL_SECONDS: ${PREVIEW_TICKET_TTL_SECONDS:-1200}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TOOLKIT_LOCAL_ROOT: ${TOOLKIT_LOCAL_ROOT:-/toolkits}
      TOOLKIT_REPO_BASE: ${TOOLKIT_REPO_BASE:-}
    volumes:
      - everflow_db:/data
    ports:
      - "8000:8000"
    depends_on:
      sandbox-agent:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${EVERFLOW_FRONTEND_IMAGE:-ghcr.io/limitless-rh/everflow-frontend:latest}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        # Same-origin /api via nginx — works for any host with one prebuilt image
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  everflow_db:
  msb_data:
  project_workspaces:
