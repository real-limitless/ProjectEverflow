# Project Everflow — container-only control plane (Docker or Podman Compose).
#
# Default: embedded local OCI registry (always-on). Seed once, then run offline.
#   ./deploy/local-registry.sh seed
#   ./scripts/everflow install
#
# INSTALL_MODE=ghcr mirrors published packages into this registry (no silent
# source-build fallback). Required names/tags: docs/images.md
# CI: .github/workflows/publish-images.yml
# Maintainers can also publish manually:
#   EVERFLOW_REGISTRY=ghcr.io/real-limitless PUSH=true ./deploy/build-images.sh
#
# From source without seed: BUILD_FROM_SOURCE=1 ./scripts/everflow-install.sh
#   or: docker compose up --build -d
#
# Host: Docker or Podman + Compose plugin; Linux /dev/kvm for real microVMs.
# Without KVM, set SANDBOX_MOCK=true for CI/dev only (not product use).
#
# Image hostname split (same registry content, different resolvers):
#   Host engine / compose image:  — localhost:5000/everflow/...
#   Inside containers (msb pull)  — registry:5000/everflow/...

services:
  # Always-on private registry for Everflow + mirrored upstream images.
  # Bootstrap image stays registry:2 (host-cached); do not point this at itself.
  registry:
    image: ${EVERFLOW_REGISTRY_IMAGE:-docker.io/library/registry:2}
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    ports:
      # Host seed/push only (bind loopback)
      - "127.0.0.1:${REGISTRY_HOST_PORT:-5000}:5000"
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:5000/v2/",
        ]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s

  sandbox-agent:
    image: ${EVERFLOW_SANDBOX_AGENT_IMAGE:-localhost:5000/everflow/everflow-sandbox-agent:latest}
    build:
      context: .
      dockerfile: deploy/sandbox-agent.Dockerfile
      args:
        MICRO_SANDBOX_BASE: ${MICRO_SANDBOX_BASE:-ghcr.io/superradcompany/microsandbox:latest}
    privileged: true
    devices:
      - /dev/kvm
    # Privileged control plane — compose network only (do not publish 8090).
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      SANDBOX_MOCK: ${SANDBOX_MOCK:-false}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-auto}
      DOCKER_HOST: unix:///var/run/docker.sock
      CONTAINER_IMAGE_REWRITE: ${CONTAINER_IMAGE_REWRITE:-registry:5000=127.0.0.1:5000}
      # msb pulls from compose DNS — use registry:5000, not localhost
      DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-registry:5000/everflow/everflow-sandbox-guest:latest}
      VOLUME_STRATEGY: ${VOLUME_STRATEGY:-auto}
      WORKSPACE_ROOT: /workspaces
      MSB_HOME: /root/.microsandbox
      # Platform API as reached from agent (MCP reverse tunnel dial target)
      PLATFORM_API_URL: ${AGENT_PLATFORM_API_URL:-http://backend:8000}
    volumes:
      - msb_data:/root/.microsandbox
      - project_workspaces:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    expose:
      - "8090"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  searxng:
    image: ${SEARXNG_IMAGE:-localhost:5000/everflow/upstream-searxng:latest}
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-everflow-dev-searxng-change-me}
    volumes:
      # :Z required on SELinux (Fedora/RHEL/Podman); without it searxng gets EACCES on settings.yml
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:Z,ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:Z,ro
    expose:
      - "8080"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${EVERFLOW_BACKEND_IMAGE:-localhost:5000/everflow/everflow-backend:latest}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/everflow.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      SANDBOX_MOCK: ${SANDBOX_MOCK:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_AGENT_URL: http://sandbox-agent:8090
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-dev-sandbox-token-change-me}
      # Same guest ref msb uses (compose DNS host)
      SANDBOX_DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-registry:5000/everflow/everflow-sandbox-guest:latest}
      SANDBOX_DEFAULT_MEMORY_MIB: ${SANDBOX_DEFAULT_MEMORY_MIB:-3072}
      SANDBOX_DEFAULT_CPUS: ${SANDBOX_DEFAULT_CPUS:-2}
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.localhost:8000}
      PREVIEW_PUBLIC_SCHEME: ${PREVIEW_PUBLIC_SCHEME:-http}
      PREVIEW_TICKET_TTL_SECONDS: ${PREVIEW_TICKET_TTL_SECONDS:-1200}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TOOLKIT_LOCAL_ROOT: ${TOOLKIT_LOCAL_ROOT:-/toolkits}
      TOOLKIT_REPO_BASE: ${TOOLKIT_REPO_BASE:-}
    volumes:
      - everflow_db:/data
    ports:
      - "8000:8000"
    depends_on:
      registry:
        condition: service_healthy
      sandbox-agent:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${EVERFLOW_FRONTEND_IMAGE:-localhost:5000/everflow/everflow-frontend:latest}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        # Same-origin /api via nginx — works for any host with one prebuilt image
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:80"
    depends_on:
      registry:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  everflow_db:
  msb_data:
  project_workspaces:
  registry_data:
